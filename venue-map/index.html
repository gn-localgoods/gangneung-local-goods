<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>행사장 위치 | 2026 강릉로컬굿즈페어</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif; background:#f1f3f5; color:#111; }
    .wrap { width:100%; max-width:1100px; margin:0 auto; padding:28px 18px 40px; }
    h1 { margin:0 0 8px; font-size:28px; line-height:1.3; }
    .sub { display:block; margin-top:3px; font-size:14px; font-weight:600; color:#444; }
    .desc { margin:16px 0 22px; color:#555; line-height:1.6; font-size:14px; }
    .desc span { display:block; }
    .map-box { background:#fff; padding:12px; border-radius:14px; border:1px solid #e5e7eb; }
    .map-box img { display:block; width:100%; height:auto; }
    .back { display:inline-block; margin-top:20px; padding:11px 15px; border-radius:10px; background:#111; color:#fff; text-decoration:none; font-weight:700; }
    @media (max-width:560px) {
      h1 { font-size:23px; }
      .sub, .desc { font-size:13px; }
      .wrap { padding:20px 12px 32px; }
      .map-box { padding:6px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>
      행사장 위치
      <span class="sub">Venue Map</span>
      <span class="sub">会場案内</span>
      <span class="sub">会场位置</span>
      <span class="sub">會場位置</span>
    </h1>

    <p class="desc">
      <span>아래 배치도에서 행사장 위치를 확인하실 수 있습니다.</span>
      <span>You can check the venue layout below.</span>
      <span>下記の配置図で会場位置をご確認いただけます。</span>
      <span>可通过下方平面图查看会场位置。</span>
      <span>可透過下方平面圖查看會場位置。</span>
    </p>

    <div class="map-box">
      <img src="./행사장 위치.jpg" alt="강릉로컬굿즈페어 행사장 배치도">
    </div>

    <a class="back" href="../">← 메인으로 돌아가기</a>
  </main>
</body>
</html>
